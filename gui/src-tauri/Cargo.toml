[package]
name = "gui"
version = "0.1.0"
description = "DieHoward - Interface gráfica para síntese de áudio de livros"
authors = ["DieHoward"]
edition = "2021"

[lib]
name = "gui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
